services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: events_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  kafka1:
    image: apache/kafka:3.7.0
    hostname: kafka1
    container_name: kafka1
    environment:
      CLUSTER_ID: '5L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093'
      KAFKA_LISTENERS: 'CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka1:9092,EXTERNAL://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    ports:
      - "29092:29092"

  kafka2:
    image: apache/kafka:3.7.0
    hostname: kafka2
    container_name: kafka2
    environment:
      CLUSTER_ID: '5L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093'
      KAFKA_LISTENERS: 'CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka2:9092,EXTERNAL://localhost:29093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    ports:
      - "29093:29093"

  kafka3:
    image: apache/kafka:3.7.0
    hostname: kafka3
    container_name: kafka3
    environment:
      CLUSTER_ID: '5L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093,2@kafka2:9093,3@kafka3:9093'
      KAFKA_LISTENERS: 'CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:29094'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka3:9092,EXTERNAL://localhost:29094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    ports:
      - "29094:29094"

  kafka-setup:
    image: apache/kafka:3.7.0
    depends_on:
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started
      kafka3:
        condition: service_started
    entrypoint: [ "bash", "-c", "until /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka1:9092 >/dev/null 2>&1 && /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka2:9092 >/dev/null 2>&1 && /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka3:9092 >/dev/null 2>&1; do echo 'Waiting for brokers...'; sleep 2; done && \
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka1:9092 --partitions 3 --replication-factor 3 --topic events --config min.insync.replicas=2 && \
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka1:9092 --partitions 3 --replication-factor 3 --topic events.dlt" ]

  producer-1: &producer-base
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install -r requirements.txt
        COPY producer.py .
        ENV PYTHONUNBUFFERED=1
        CMD ["python", "producer.py"]
    environment:
      KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
      POD_ID: producer-1
      KEY_MODE: none
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  producer-2:
    <<: *producer-base
    environment:
      KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
      POD_ID: producer-2
      KEY_MODE: none
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  producer-3:
    <<: *producer-base
    environment:
      KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
      POD_ID: producer-3
      KEY_MODE: none
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  consumer-1: &consumer-base
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install -r requirements.txt
        COPY consumer.py .
        ENV PYTHONUNBUFFERED=1
        CMD ["python", "consumer.py"]
    environment:
      KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
      DB_DSN: postgresql://user:password@postgres:5432/events_db
      POD_ID: consumer-1
      PROCESSING_DELAY_MS: 100
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_started

  consumer-2:
    <<: *consumer-base
    environment:
      KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
      DB_DSN: postgresql://user:password@postgres:5432/events_db
      POD_ID: consumer-2
      PROCESSING_DELAY_MS: 100

  consumer-3:
    <<: *consumer-base
    environment:
      KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
      DB_DSN: postgresql://user:password@postgres:5432/events_db
      POD_ID: consumer-3
      PROCESSING_DELAY_MS: 100